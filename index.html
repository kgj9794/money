<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>축의금 관리 시스템</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 토스트 알림 컨테이너 -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- 메인 헤더 -->
  <header id="mainHeader" class="main-header hidden">
    <div class="header-container">
      <div class="brand">
        <span class="brand-name">축의금 관리</span>
      </div>
      <nav class="nav-tabs">
        <button type="button" id="navRegisterBtn" class="nav-tab active">축의금 등록</button>
        <button type="button" id="navListBtn" class="nav-tab">등록 내역 목록</button>
      </nav>
      <div class="user-profile">
        <span class="user-greeting">
          <strong id="headerUserName">-</strong>님
          <span id="headerUserSideBadge" class="user-side-badge groom">신랑측</span>
        </span>
        <button type="button" id="headerLogoutBtn" class="btn-logout">로그아웃</button>
      </div>
    </div>
  </header>

  <div class="wrapper">
    <!-- 인증 카드 (로그인 / 회원가입) -->
    <div id="authCard" class="card">
      <div class="card-hero">
        <span class="hero-badge">Wedding Day</span>
        <h1 class="hero-title">축의금 관리 시스템</h1>
        <p class="hero-desc">소중한 마음을 투명하고 편리하게 기록하세요.</p>
      </div>
      <div class="card-body">
        <!-- 로그인 폼 -->
        <form id="loginForm">
          <h2 class="auth-title">로그인</h2>
          <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" placeholder="아이디를 입력하세요" required>
          </div>
          <div class="form-group">
            <label for="loginPw">비밀번호</label>
            <input type="password" id="loginPw" placeholder="비밀번호를 입력하세요" required>
          </div>
          <button type="submit" id="loginSubmitBtn" class="btn-primary">로그인</button>
          <div class="auth-footer">
            <span>계정이 없으신가요?</span>
            <button type="button" id="goToSignupBtn" class="btn-text-link">회원가입 신청</button>
          </div>
        </form>

        <!-- 회원가입 폼 -->
        <form id="signupForm" class="hidden">
          <h2 class="auth-title">회원가입 신청</h2>
          <div class="form-group">
            <label class="section-label">구분 <span class="required">*</span></label>
            <div class="target-selector">
              <label class="radio-label">
                <input type="radio" name="signupSide" value="신랑" checked>
                <span class="btn-radio">신랑측</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="signupSide" value="신부">
                <span class="btn-radio">신부측</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="signupName">이름 <span class="required">*</span></label>
            <input type="text" id="signupName" placeholder="이름을 입력하세요" required>
          </div>
          <div class="form-group">
            <label for="signupId">아이디 <span class="required">*</span></label>
            <input type="text" id="signupId" placeholder="아이디를 입력하세요" required>
          </div>
          <div class="form-group">
            <label for="signupPw">비밀번호 <span class="required">*</span></label>
            <input type="password" id="signupPw" placeholder="비밀번호를 입력하세요" required>
          </div>
          <div class="form-group">
            <label for="signupPwConfirm">비밀번호 확인 <span class="required">*</span></label>
            <input type="password" id="signupPwConfirm" placeholder="비밀번호를 다시 입력하세요" required>
          </div>
          <button type="submit" id="signupSubmitBtn" class="btn-primary">회원가입 신청</button>
          <div class="auth-footer">
            <span>이미 계정이 있으신가요?</span>
            <button type="button" id="goToLoginBtn" class="btn-text-link">로그인</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 앱 메인 컨텐츠 영역 -->
    <main id="appContent" class="app-content hidden">
      <!-- 1. 축의금 등록 섹션 -->
      <section id="registerSection" class="dashboard-panel register-container">
        <div class="panel-header">
          <h2 class="panel-title">축의금 등록</h2>
          <p class="panel-sub">전달받은 축의금 내역을 입력해 주세요.</p>
        </div>
        <form id="giftForm">
          <div class="form-group">
            <label for="name">성함 <span class="required">*</span></label>
            <input type="text" id="name" placeholder="예: 홍길동" required>
          </div>
          <div class="form-group">
            <label for="amount">금액 (원) <span class="required">*</span></label>
            <input type="text" id="amount" placeholder="0" required>
            <div class="quick-amount-group">
              <button type="button" class="btn-quick" data-amount="10000">+1만</button>
              <button type="button" class="btn-quick" data-amount="50000">+5만</button>
              <button type="button" class="btn-quick" data-amount="100000">+10만</button>
              <button type="button" class="btn-quick" data-amount="1000000">+100만</button>
            </div>
            <button type="button" id="resetAmountBtn" class="btn-reset">금액 정정 (초기화)</button>
          </div>
          <div class="form-group">
            <label for="note">메모 / 비고</label>
            <textarea id="note" placeholder="소속, 관계 또는 기타 참고사항을 입력하세요"></textarea>
          </div>
          <button type="submit" id="submitBtn" class="btn-primary">저장하기</button>
        </form>
      </section>

      <!-- 2. 등록 내역 목록 섹션 -->
      <section id="listSection" class="dashboard-panel hidden">
        <div class="panel-header flex-between">
          <div>
            <h2 class="panel-title">등록 내역 목록</h2>
            <p id="listSubTitle" class="panel-sub">축의금 등록 내역입니다.</p>
          </div>
          <button type="button" id="refreshListBtn" class="btn-secondary btn-sm">새로고침</button>
        </div>

        <!-- 2칸 요약 통계 카드 -->
        <div class="stats-grid-2">
          <div class="stat-card">
            <span class="stat-label">총 등록 건수</span>
            <span id="statTotalCount" class="stat-value">0건</span>
          </div>
          <div id="statSideCard" class="stat-card stat-groom">
            <span id="statSideLabel" class="stat-label">측 총 금액</span>
            <span id="statSideTotal" class="stat-value">0원</span>
          </div>
        </div>

        <!-- 필터 및 검색 바 -->
        <div class="filter-bar">
          <div class="search-box">
            <input type="text" id="listSearchInput" placeholder="이름 또는 메모 검색...">
          </div>
          <div class="filter-group">
            <label class="checkbox-label">
              <input type="checkbox" id="myRegistrationOnly">
              <span>내가 등록한 건만 보기</span>
            </label>
          </div>
        </div>

        <!-- 데이터 테이블 -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>구분</th>
                <th>성함</th>
                <th>금액</th>
                <th>비고</th>
                <th>등록일시</th>
                <th>등록자</th>
                <th class="text-center">관리</th>
              </tr>
            </thead>
            <tbody id="giftTableBody">
              <!-- JS 동적 생성 -->
            </tbody>
          </table>
          <div id="emptyListState" class="empty-state hidden">
            등록된 축의금 내역이 없습니다.
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 수정 모달 -->
  <div id="editModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>축의금 내역 수정</h3>
        <button type="button" id="closeModalBtn" class="btn-close">&times;</button>
      </div>
      <form id="editForm">
        <input type="hidden" id="editRowId">
        <input type="hidden" id="editTarget">
        <div class="form-group">
          <label for="editName">성함 <span class="required">*</span></label>
          <input type="text" id="editName" required>
        </div>
        <div class="form-group">
          <label for="editAmount">금액 (원) <span class="required">*</span></label>
          <input type="text" id="editAmount" required>
        </div>
        <div class="form-group">
          <label for="editNote">메모 / 비고</label>
          <textarea id="editNote"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelEditBtn" class="btn-secondary" style="flex: 1;">취소</button>
          <button type="submit" id="saveEditBtn" class="btn-primary" style="flex: 1; margin-top: 0;">수정 완료</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
