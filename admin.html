<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>축의금 관리 시스템 - 관리자 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Admin 전용 레이아웃 및 UI 보완 */
    .admin-lock-wrapper {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-badge-pending {
      background-color: #fff3bf;
      color: #f59f00;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .btn-approve {
      background-color: #2b8a3e;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-approve:hover { background-color: #237032; }

    .btn-reject {
      background-color: #e03131;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-reject:hover { background-color: #c92a2a; }

    .text-muted { color: #868e96; }

    /* 새로고침 아이콘 회전 애니메이션 */
    .spin {
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 테이블 로딩 스피너 디자인 */
    .table-loading {
      text-align: center;
      padding: 36px 0;
      color: #666;
    }

    .spinner {
      display: inline-block;
      width: 26px;
      height: 26px;
      border: 3px solid #e9ecef;
      border-radius: 50%;
      border-top-color: #228be6;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div id="toastContainer" class="toast-container"></div>

  <!-- 1. 관리자 비밀번호 인증 화면 -->
  <div id="adminAuthSection" class="wrapper admin-lock-wrapper">
    <div class="card animate-scale-in">
      <div class="card-hero">
        <span class="hero-badge">Admin Security</span>
        <h1 class="hero-title">관리자 인증</h1>
        <p class="hero-desc">관리자 비밀번호를 입력하여 접근을 승인받으세요.</p>
      </div>
      <div class="card-body">
        <form id="adminLoginForm">
          <div class="form-group">
            <label for="adminPassword">관리자 비밀번호 <span class="required">*</span></label>
            <input type="password" id="adminPassword" placeholder="비밀번호 입력" required autocomplete="current-password">
          </div>
          <button type="submit" id="adminLoginSubmitBtn" class="btn-primary">대시보드 접속</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 2. 관리자 메인 대시보드 -->
  <div id="adminDashboardSection" class="hidden">
    <header class="main-header">
      <div class="header-container">
        <div class="brand">
          <span class="brand-icon">🛡️</span>
          <span class="brand-name">관리자 대시보드</span>
        </div>
        <div class="user-profile">
          <span class="user-greeting"><strong>최고 관리자</strong> 권한 세션</span>
          <button type="button" id="adminLogoutBtn" class="btn-logout">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="wrapper">
      <main class="app-content">
        <section class="dashboard-panel animate-fade-in-up">
          <div class="panel-header flex-between">
            <div>
              <h2 class="panel-title">회원가입 승인 대기 목록</h2>
              <p class="panel-sub">신규 회원가입 신청을 확인하고 승인/거절을 진행하세요.</p>
            </div>
            <button type="button" id="refreshPendingBtn" class="btn-secondary btn-sm">
              <span class="refresh-icon">🔄</span> 새로고침
            </button>
          </div>

          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>구분</th>
                  <th>이름</th>
                  <th>아이디</th>
                  <th>신청일시</th>
                  <th>상태</th>
                  <th class="text-center">승인 관리</th>
                </tr>
              </thead>
              <tbody id="pendingTableBody"></tbody>
            </table>
            <div id="emptyPendingState" class="empty-state hidden">
              <span>승인 대기 중인 회원가입 신청이 없습니다.</span>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwB46MO3t7uWLvQLGv-HTfkxyX946K0oJUVhvqAQxBPoNoD_78ytz4WBje8U0J66K2S/exec";

    const adminAuthSection = document.getElementById('adminAuthSection');
    const adminDashboardSection = document.getElementById('adminDashboardSection');
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminPasswordInput = document.getElementById('adminPassword');
    const adminLoginSubmitBtn = document.getElementById('adminLoginSubmitBtn');
    const adminLogoutBtn = document.getElementById('adminLogoutBtn');
    const pendingTableBody = document.getElementById('pendingTableBody');
    const emptyPendingState = document.getElementById('emptyPendingState');
    const refreshPendingBtn = document.getElementById('refreshPendingBtn');
    const toastContainer = document.getElementById('toastContainer');

    document.addEventListener('DOMContentLoaded', () => {
      const savedAdminPw = sessionStorage.getItem('admin_key');
      if (savedAdminPw) {
        showDashboard();
      }
    });

    // 1. 관리자 로그인 (GAS 백엔드 비밀번호 검증)
    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const inputPw = adminPasswordInput.value.trim();

      adminLoginSubmitBtn.disabled = true;
      adminLoginSubmitBtn.textContent = "인증 중...";

      try {
        const response = await sendRequest({ action: 'adminLogin', password: inputPw });
        if (response.status === 'success') {
          sessionStorage.setItem('admin_key', inputPw);
          showToast("관리자 인증되었습니다.", "success");
          adminPasswordInput.value = '';
          showDashboard();
        } else {
          showToast(response.message, "error");
          adminPasswordInput.value = '';
          adminPasswordInput.focus();
        }
      } catch (err) {
        showToast("인증 요청 중 오류가 발생했습니다.", "error");
      } finally {
        adminLoginSubmitBtn.disabled = false;
        adminLoginSubmitBtn.textContent = "대시보드 접속";
      }
    });

    // 2. 로그아웃
    adminLogoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('admin_key');
      adminDashboardSection.classList.add('hidden');
      adminAuthSection.classList.remove('hidden');
      showToast("관리자 세션이 종료되었습니다.", "success");
    });

    function showDashboard() {
      adminAuthSection.classList.add('hidden');
      adminDashboardSection.classList.remove('hidden');
      loadPendingUsers();
    }

    // 3. 승인 대기 목록 조회 (테이블 로딩 스피너 표시)
    async function loadPendingUsers() {
      pendingTableBody.innerHTML = `
        <tr>
          <td colspan="6" class="table-loading">
            <div class="spinner"></div>
            <div>목록을 불러오는 중...</div>
          </td>
        </tr>
      `;
      emptyPendingState.classList.add('hidden');

      const adminKey = sessionStorage.getItem('admin_key');
      try {
        const response = await sendRequest({
          action: 'getPendingUsers',
          adminPassword: adminKey
        });

        if (response.status === 'success') {
          renderPendingTable(response.users || []);
        } else {
          pendingTableBody.innerHTML = '';
          showToast(response.message, "error");
          if (response.message.includes("권한")) {
            adminLogoutBtn.click();
          }
        }
      } catch (err) {
        pendingTableBody.innerHTML = '';
        showToast("승인 대기 목록을 불러오는 데 실패했습니다.", "error");
      }
    }

    // 4. 새로고침 버튼 클릭 (버튼 아이콘 회전 애니메이션)
    refreshPendingBtn.addEventListener('click', async () => {
      const icon = refreshPendingBtn.querySelector('.refresh-icon');

      refreshPendingBtn.disabled = true;
      if (icon) icon.classList.add('spin');

      await loadPendingUsers();

      if (icon) icon.classList.remove('spin');
      refreshPendingBtn.disabled = false;
      showToast("목록을 새로고침했습니다.", "success");
    });

    // 5. 목록 렌더링
    function renderPendingTable(users) {
      pendingTableBody.innerHTML = '';

      if (users.length === 0) {
        emptyPendingState.classList.remove('hidden');
        return;
      }

      emptyPendingState.classList.add('hidden');

      users.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="badge-target ${user.side === '신랑' ? 'badge-groom' : 'badge-bride'}">${user.side}측</span></td>
          <td><strong>${escapeHtml(user.name)}</strong></td>
          <td>${escapeHtml(user.id)}</td>
          <td><small class="text-muted">${user.timestamp || '-'}</small></td>
          <td><span class="admin-badge-pending">승인 대기</span></td>
          <td class="text-center">
            <div class="action-btns">
              <button type="button" class="btn-approve">수락</button>
              <button type="button" class="btn-reject">거절</button>
            </div>
          </td>
        `;

        tr.querySelector('.btn-approve').addEventListener('click', () => processApproval(user.id, 'approve'));
        tr.querySelector('.btn-reject').addEventListener('click', () => processApproval(user.id, 'reject'));

        pendingTableBody.appendChild(tr);
      });
    }

    // 6. 승인/거절 처리
    async function processApproval(userId, type) {
      const actionName = type === 'approve' ? '수락' : '거절';
      if (!confirm(`[${userId}] 사용자의 회원가입을 ${actionName}하시겠습니까?`)) return;

      const adminKey = sessionStorage.getItem('admin_key');

      try {
        const response = await sendRequest({
          action: 'approveUser',
          adminPassword: adminKey,
          userId: userId,
          type: type
        });

        if (response.status === 'success') {
          showToast(`회원가입이 ${actionName} 되었습니다.`, "success");
          loadPendingUsers();
        } else {
          showToast(response.message, "error");
        }
      } catch (err) {
        showToast(`${actionName} 처리 중 오류가 발생했습니다.`, "error");
      }
    }

    // 7. GAS 요청 전송 공통 함수
    async function sendRequest(payload) {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    // 8. 토스트 메시지
    function showToast(message, type = "success") {
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'error' ? 'toast-error' : ''}`;
      toast.innerHTML = `
        <div class="toast-header">
          <span class="toast-title">${type === 'error' ? '알림' : '성공'}</span>
          <button type="button" class="btn-toast-close">&times;</button>
        </div>
        <div class="toast-body">${message}</div>
      `;

      toastContainer.appendChild(toast);
      toast.querySelector('.btn-toast-close').addEventListener('click', () => toast.remove());

      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 4000);
    }

    // 9. XSS 방지 이스케이프
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
